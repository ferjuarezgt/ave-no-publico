<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descifrando dirección e intensidad · AVE UVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PALETA AVE · 2756 C #0f1c75 · 2727 C #1c73f5 · 354 C #00ab0d · 7549 C #ffb500
   Maquetación fluida: se adapta al ancho del contenedor y nunca depende
   del alto, así nada queda recortado dentro de Genially ni en celular.
   ===================================================================== */
:root{
  --navy:#0f1c75; --navy-25:#c3c7de;
  --blue:#1c73f5; --blue-50:#8db9fa;
  --green:#00ab0d; --green-10:#e5f7e7;
  --amber:#ffb500; --amber-15:#fff4da;
  --paper:#f4f7fd; --ink:#101534; --ink-soft:#4a5275;
  --acc:var(--blue); --acc-ink:#fff;
  --shadow:0 16px 44px -28px rgba(15,28,117,.55);
  --pad:clamp(15px,2.2vw,26px);
}
*{box-sizing:border-box}
html{margin:0}
body{margin:0;background:var(--paper);min-height:100%}
body{
  font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
#app{max-width:1200px;margin:0 auto;padding:var(--pad) var(--pad) calc(var(--pad) + 8px)}
body.is-cover{background:#fff}
body.is-close{background:#0d1667}

/* ------------------------------ barra superior ------------------------------ */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo-sm{height:clamp(26px,2.6vw,34px);width:auto;display:block;flex:0 0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  font:inherit;font-size:clamp(12px,1.25vw,14px);font-weight:700;border:0;cursor:pointer;
  border-radius:99px;padding:9px 15px;background:transparent;color:#7c87ae;white-space:nowrap;
}
.chip.on{background:var(--navy);color:#fff}
.chip.blocked{opacity:.36;cursor:not-allowed}
.counter{font-size:clamp(12px,1.2vw,13.5px);font-weight:700;color:#7c87ae;font-variant-numeric:tabular-nums;flex:0 0 auto}
body.is-close .chip{color:#9aa8dd}
body.is-close .chip.on{background:#fff;color:var(--navy)}
body.is-close .counter{color:#9aa8dd}
body.is-close .logo-sm{background:#fff;border-radius:9px;padding:5px 9px;box-sizing:content-box}
.track{height:6px;border-radius:99px;background:#e2e8f7;overflow:hidden;margin-bottom:clamp(16px,2.4vw,26px)}
body.is-close .track{background:rgba(255,255,255,.18)}
.track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s ease}

/* -------------------------------- diapositivas -------------------------------- */
.slide{display:none}
.slide.is-active{display:block}

/* portada */
.cover-logo{height:clamp(52px,7vw,84px);width:auto;display:block;margin-bottom:clamp(20px,3vw,32px)}
.eyebrow{font-size:clamp(11.5px,1.2vw,13px);font-weight:700;letter-spacing:.15em;color:var(--green);margin:0 0 10px}
h1.cover-title{
  font-size:clamp(32px,5.6vw,64px);line-height:1;letter-spacing:-.035em;font-weight:800;
  color:var(--navy);margin:0 0 clamp(14px,2vw,20px);
}
h1.cover-title em{font-style:normal;font-weight:300;display:block;color:var(--blue);letter-spacing:-.03em}
.lead{font-size:clamp(14.5px,1.5vw,17.5px);line-height:1.62;color:var(--ink-soft);margin:0;max-width:62ch}

/* escala de correlación */
.scale{position:relative;margin:clamp(42px,4.6vw,54px) 0 8px}
.scale-track{
  height:13px;border-radius:99px;position:relative;
  background:linear-gradient(90deg,var(--navy) 0%,#9aa2ce 28%,#e7ebf6 50%,var(--blue-50) 72%,var(--blue) 100%);
  box-shadow:inset 0 0 0 1px rgba(15,28,117,.1);
}
.scale-zero{position:absolute;left:50%;top:-7px;bottom:-7px;width:2px;background:rgba(15,28,117,.3);transform:translateX(-50%)}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:12px}
.scale-ends span:nth-child(2){opacity:.5}
.scale-zones{display:grid;grid-template-columns:repeat(6,1fr);margin-top:7px;font-size:clamp(9px,.95vw,11px);font-weight:500;color:#8a92b4;text-align:center}
.scale-zones span{padding-top:5px;border-top:1px solid rgba(15,28,117,.12)}
.pin{position:absolute;top:6px;transform:translateY(-50%);margin-left:-12px}
.pin-dot{width:24px;height:24px;border-radius:50%;background:#fff;border:6px solid var(--pc,var(--blue));box-shadow:0 4px 12px rgba(15,28,117,.28)}
.pin-label{position:absolute;left:12px;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:11px;font-weight:700;color:var(--pc,var(--blue))}
.pin-label b{display:block;font-size:clamp(15px,1.8vw,20px);font-weight:800;letter-spacing:-.02em}
.pin--up .pin-label{bottom:28px}
.pin--down .pin-label{top:28px}
.scale--dark .scale-track{box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.scale--dark .scale-ends{color:#aab8ea}
.scale--dark .scale-zones{color:#8e9bd4}
.scale--dark .scale-zones span{border-top-color:rgba(255,255,255,.16)}
.scale--dark .scale-zero{background:rgba(255,255,255,.4)}

/* guía */
.title-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:clamp(16px,2.2vw,26px)}
h2.section-title{font-size:clamp(25px,3.5vw,40px);line-height:1.04;letter-spacing:-.032em;font-weight:800;color:var(--navy);margin:0}
.tag{display:inline-flex;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.04em}
.cards3{display:grid;gap:clamp(12px,1.6vw,20px);grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border-radius:18px;padding:clamp(18px,2.2vw,28px);border-top:5px solid var(--acc);box-shadow:var(--shadow)}
.card .num{display:block;font-size:clamp(26px,3vw,36px);font-weight:800;color:var(--acc);line-height:1;margin-bottom:10px;letter-spacing:-.04em}
.card h3{margin:0 0 8px;font-size:clamp(15.5px,1.6vw,18px);font-weight:700;color:var(--navy);letter-spacing:-.015em}
.card p{margin:0;font-size:clamp(13.5px,1.35vw,15.5px);line-height:1.58;color:var(--ink-soft)}
.aside{margin:14px 2px 0;font-size:clamp(13px,1.32vw,15px);line-height:1.56;color:var(--ink-soft)}
.hint{margin-top:clamp(16px,2.2vw,24px);font-size:clamp(13px,1.3vw,15px);color:var(--ink-soft);font-weight:500;line-height:1.6}

/* casos */
.case-kicker{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:clamp(11.5px,1.25vw,13px);font-weight:700;letter-spacing:.09em;color:var(--acc)}
.case-kicker .bar{height:3px;width:38px;background:var(--acc);border-radius:9px;flex:0 0 auto}
h2.case-title{font-size:clamp(23px,3.2vw,36px);line-height:1.08;letter-spacing:-.032em;font-weight:800;color:var(--navy);margin:0}
.case-intro{font-size:clamp(14.5px,1.45vw,16.5px);line-height:1.58;color:var(--ink-soft);margin:10px 0 clamp(14px,1.9vw,20px);max-width:82ch}
.split{display:grid;gap:clamp(14px,1.9vw,24px);grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);align-items:center}

.figure{background:#fff;border-radius:18px;padding:clamp(10px,1.1vw,16px);box-shadow:var(--shadow);margin:0}
.figure img{display:block;width:100%;height:auto;border-radius:10px}

.rcard{margin-top:clamp(12px,1.4vw,16px);background:var(--navy);color:#fff;border-radius:18px;padding:clamp(16px,1.8vw,22px) clamp(18px,2vw,26px)}
.rcard-top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.rval{font-size:clamp(34px,4.4vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.rval .rsym{font-style:italic;font-weight:600;opacity:.62;font-size:.42em;margin-right:.18em}
.rmeta{font-size:clamp(12px,1.25vw,13.5px);font-weight:500;color:#aab8ea;line-height:1.5;max-width:28ch}

/* preguntas */
.qcard{background:#fff;border-radius:22px;padding:clamp(20px,2.4vw,32px);box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.step{font-size:clamp(11.5px,1.2vw,13px);font-weight:700;letter-spacing:.07em;color:var(--acc)}
.qdots{display:flex;gap:5px;flex:0 0 auto}
.qdots i{width:22px;height:4px;border-radius:9px;background:var(--navy-25)}
.qdots i.on{background:var(--acc)}
h3.q{margin:0 0 clamp(16px,2vw,22px);font-size:clamp(19px,2.3vw,27px);line-height:1.26;letter-spacing:-.024em;font-weight:700;color:var(--navy)}
.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  font:inherit;font-size:clamp(15px,1.5vw,17px);font-weight:600;color:var(--ink);line-height:1.4;
  background:var(--paper);border:2px solid transparent;border-radius:14px;
  padding:16px 18px;min-height:60px;
  transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.opt .bullet{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#fff;
  box-shadow:inset 0 0 0 2px var(--navy-25);display:grid;place-items:center;
  font-size:14px;font-weight:800;color:var(--navy);
}
.opt:disabled{cursor:default}
.opt.is-right{background:var(--green-10);border-color:var(--green);color:#07600f}
.opt.is-right .bullet{box-shadow:inset 0 0 0 2px var(--green);color:var(--green)}
.opt.is-wrong{background:var(--amber-15);border-color:var(--amber);color:#7a5600}
.opt.is-wrong .bullet{box-shadow:inset 0 0 0 2px var(--amber);color:#9a6c00}
.opt.is-dim{opacity:.4}

.fb{margin-top:16px;border-radius:16px;padding:clamp(16px,1.8vw,20px);display:none;border-left:6px solid var(--green);background:var(--green-10)}
.fb.show{display:block}
.fb.wrong{background:var(--amber-15);border-left-color:var(--amber)}
.fb h4{margin:0 0 8px;font-size:clamp(14.5px,1.5vw,16.5px);font-weight:800;color:#07600f;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.fb.wrong h4{color:#7a5600}
.fb h4 .mk{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.fb.wrong h4 .mk{background:var(--amber)}
.fb p{margin:0;font-size:clamp(13.5px,1.4vw,15.5px);line-height:1.62;color:var(--ink-soft)}
.fb .act{margin-top:16px}

/* cierre */
.close-wrap{background:linear-gradient(150deg,#0b1559,#0f1c75 58%,#16238c);border-radius:22px;padding:clamp(22px,3vw,44px);color:#fff}
.close-wrap .eyebrow{color:var(--amber)}
h2.close-title{font-size:clamp(26px,4vw,46px);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:0 0 clamp(22px,3vw,34px)}
.keys{display:grid;gap:clamp(12px,1.6vw,20px);grid-template-columns:repeat(3,1fr)}
.key{background:rgba(255,255,255,.1);border-radius:18px;padding:clamp(18px,2.2vw,26px);border-top:4px solid var(--kc,var(--blue))}
.key .kl{font-size:11.5px;font-weight:700;letter-spacing:.11em;color:var(--kc,var(--blue));display:block;margin-bottom:10px}
.key h3{margin:0 0 9px;font-size:clamp(15.5px,1.6vw,18px);font-weight:700;color:#fff;letter-spacing:-.015em}
.key p{margin:0;font-size:clamp(13.5px,1.35vw,15px);line-height:1.58;color:#cfdaff}

/* ------------------------------ controles ------------------------------ */
.navrow{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:clamp(14px,1.8vw,20px);padding-top:clamp(12px,1.5vw,16px);
  border-top:1px solid #dde4f5;
}
body.is-close .navrow{border-top-color:rgba(255,255,255,.18)}
.lock{
  display:none;align-items:center;gap:9px;flex:1;min-width:200px;
  font-size:clamp(13px,1.35vw,15px);font-weight:700;color:#8a6200;
  background:var(--amber-15);border-radius:99px;padding:12px 18px;
}
.lock.show{display:inline-flex}
.navbtns{display:flex;gap:10px;margin-left:auto}
.btn{
  font:inherit;font-size:clamp(15px,1.5vw,17px);font-weight:700;border:0;border-radius:99px;
  padding:16px 26px;min-height:56px;cursor:pointer;background:var(--navy);color:#fff;
  display:inline-flex;align-items:center;gap:10px;line-height:1;
}
.btn .ar{font-size:1.15em;line-height:1}
.btn--ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.btn:disabled{opacity:.34;cursor:not-allowed}
body.is-close .btn{background:#fff;color:var(--navy)}
body.is-close .btn--ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}

/* -------------------------- pantallas angostas -------------------------- */
@media (min-width:861px){
  .figure img{max-height:min(272px,27vw);object-fit:contain}
  .slide .split{align-items:center}
}
@media (max-width:860px){
  .split{grid-template-columns:1fr}
  .cards3,.keys{grid-template-columns:1fr}
  .navbtns{width:100%;margin-left:0}
  .navbtns .btn{flex:1;justify-content:center;padding:18px 18px;min-height:60px}
  .lock{width:100%;justify-content:center;text-align:center}
  .topbar{gap:10px}
  .counter{order:3}
  .pin-label b{font-size:15px}
}
@media (max-width:520px){
  .qmeta{flex-direction:column;align-items:flex-start;gap:8px}
  .scale-zones{font-size:8.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

        ok:{h:"Correcto",p:"El coeficiente de correlación es mayor que cero y el diagrama muestra una tendencia ascendente. Esto indica que las variables presentan una relación lineal positiva."},
        mal:{h:"Observa nuevamente el valor del coeficiente y el diagrama",p:"Cuando los puntos muestran una tendencia ascendente y el coeficiente de correlación es mayor que cero, la relación es positiva, independientemente de que la relación sea fuerte, moderada o débil."} },
      { etiqueta:"Intensidad",
        enunciado:"¿Qué tan fuerte es la relación?",
        opciones:[{t:"Fuerte",ok:false},{t:"Moderada",ok:true},{t:"Muy débil",ok:false}],
        ok:{h:"Correcto",p:"El coeficiente de correlación se encuentra a una distancia intermedia de +1, lo que indica una relación lineal positiva moderada. Además, aunque los puntos siguen una tendencia ascendente, presentan una dispersión mayor que la observada en una relación fuerte."},
        mal:{h:"Observa nuevamente el valor del coeficiente y el diagrama",p:"La magnitud del coeficiente de correlación indica la fuerza de la relación. En este caso, el valor de r es positivo, pero no está tan cercano a +1, y el diagrama muestra una tendencia ascendente con una dispersión moderada de los puntos."} },
      { etiqueta:"Conclusión",
        enunciado:"¿Cuál conclusión describe mejor este caso?",
        opciones:[
          {t:"Conforme aumenta el número de visitas realizadas por los asesores comerciales, las ventas mensuales tienden a aumentar.",ok:true},
          {t:"Conforme aumenta el número de visitas, las ventas mensuales tienden a disminuir.",ok:false},
          {t:"No existe una relación lineal entre las variables.",ok:false}],
        ok:{h:"Correcto",p:"La conclusión es coherente con el diagrama de dispersión y con el coeficiente de correlación. Ambos muestran una relación lineal positiva moderada, por lo que es razonable concluir que, en este conjunto de datos, conforme aumenta el número de visitas realizadas por los asesores comerciales, las ventas mensuales tienden a aumentar."},
        mal:{h:"Revisa el contexto, el diagrama y el coeficiente",p:"Para elaborar una conclusión, es importante integrar toda la información disponible. En este caso, el diagrama muestra una tendencia ascendente y el coeficiente de correlación es positivo, lo que indica que ambas variables tienden a cambiar en la misma dirección. Además, el valor de r muestra que esta relación es moderada."} }
    ]
  }
];

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pos = r => ((r+1)/2*100).toFixed(1) + '%';

const figura = caso =>
  `<figure class="figure"><img src="${GRAFICOS[caso.id]}" alt="Diagrama de dispersión: ${esc(caso.graficoTitulo)}"></figure>`;

const escala = caso =>
  `<div class="scale scale--dark" style="margin:22px 0 6px">
     <div class="scale-track"><div class="scale-zero"></div></div>
     <div class="pin pin--up" style="left:${pos(caso.r)};--pc:${caso.acc==='var(--navy)'?'#6f7cc4':caso.acc}"><div class="pin-dot"></div></div>
     <div class="scale-ends"><span>−1</span><span>0</span><span>+1</span></div>
     <div class="scale-zones"><span>fuerte</span><span>moderada</span><span>débil</span><span>débil</span><span>moderada</span><span>fuerte</span></div>
   </div>`;

const tarjetaR = (caso, conEscala) =>
  `<div class="rcard">
     <div class="rcard-top">
       <div class="rval"><span class="rsym">r</span>${esc(caso.rTexto)}</div>
       <div class="rmeta">${esc(caso.rLectura)}</div>
     </div>
     ${conEscala ? escala(caso) : ''}
   </div>`;

const slides = [];

slides.push({ chapter:0, lock:false, cover:true, acc:'var(--blue)', accInk:'#fff',
  html:`<section class="slide">
    <img class="cover-logo" src="${LOGO}" alt="AVE UVG">
    <p class="eyebrow">Correlación lineal</p>
    <h1 class="cover-title">Descifrando <em>dirección e intensidad</em></h1>
    <p class="lead">Tres casos de empresa. En cada uno vas a leer el signo del coeficiente, medir su magnitud y traducir el resultado en una conclusión que tenga sentido para el negocio.</p>
    <div class="scale">
      <div class="scale-track"><div class="scale-zero"></div></div>
      <div class="pin pin--up" style="left:${pos(-0.94)};--pc:var(--navy)"><div class="pin-dot"></div><div class="pin-label">Caso 2<b>−0.94</b></div></div>
      <div class="pin pin--down" style="left:${pos(0.60)};--pc:#d99b00"><div class="pin-dot"></div><div class="pin-label"><b>+0.60</b>Caso 3</div></div>
      <div class="pin pin--up" style="left:${pos(0.98)};--pc:var(--blue)"><div class="pin-dot"></div><div class="pin-label">Caso 1<b>+0.98</b></div></div>
      <div class="scale-ends"><span>−1</span><span>0</span><span>+1</span></div>
    </div>
  </section>`});

slides.push({ chapter:0, lock:false, acc:'var(--blue)', accInk:'#fff',
  html:`<section class="slide">
    <div class="title-row">
      <h2 class="section-title">Dos preguntas, un solo número</h2>
      <span class="tag">Antes de empezar</span>
    </div>
    <div class="cards3">
      <div class="card">
        <span class="num">±</span>
        <h3>El signo dice hacia dónde</h3>
        <p>Si <em>r</em> es mayor que cero, las variables suben juntas: relación positiva. Si es menor que cero, una sube mientras la otra baja: relación negativa.</p>
      </div>
      <div class="card" style="--acc:#d99b00">
        <span class="num">|r|</span>
        <h3>La magnitud dice cuánto</h3>
        <p>Mientras más se acerca el valor a +1 o a −1, más fuerte es la relación y menos dispersos están los puntos alrededor del patrón general.</p>
      </div>
      <div class="card" style="--acc:var(--green)">
        <span class="num">→</span>
        <h3>El contexto cierra la idea</h3>
        <p>El coeficiente y el diagrama de dispersión se interpretan juntos, y siempre dentro del conjunto de datos que estás analizando.</p>
      </div>
    </div>
    <p class="hint">Usa los botones <strong>Anterior</strong> y <strong>Siguiente</strong> para moverte. En el teléfono también puedes deslizar con el dedo. Cada pregunta se desbloquea al responderla correctamente.</p>
  </section>`});

CASOS.forEach((caso, ci) => {
  slides.push({ chapter:ci+1, lock:false, acc:caso.acc, accInk:caso.accInk,
    html:`<section class="slide">
      <div class="case-kicker"><span class="bar"></span> Caso ${caso.n}</div>
      <h2 class="case-title">${esc(caso.titulo)}</h2>
      <p class="case-intro">${esc(caso.contexto)}</p>
      <div class="split">
        ${figura(caso)}
        <div>
          ${tarjetaR(caso,true)}
          <p class="aside">Antes de responder, mira el diagrama: ¿los puntos suben o bajan de izquierda a derecha, y qué tan apegados están al patrón general? Compara esa lectura con el valor de <em>r</em>.</p>
        </div>
      </div>
    </section>`});

  caso.preguntas.forEach((q, qi) => {
    const dots = caso.preguntas.map((_,k)=>`<i class="${k<=qi?'on':''}"></i>`).join('');
    const opts = q.opciones.map((o,k)=>`
      <button class="opt" data-ok="${o.ok}">
        <span class="bullet">${String.fromCharCode(65+k)}</span>
        <span>${esc(o.t)}</span>
      </button>`).join('');
    slides.push({ chapter:ci+1, lock:true, acc:caso.acc, accInk:caso.accInk,
      html:`<section class="slide">
        <div class="case-kicker"><span class="bar"></span> Caso ${caso.n} &nbsp;|&nbsp; ${esc(caso.titulo)}</div>
        <div class="split" style="margin-top:12px">
          <div>
            ${figura(caso)}
            ${tarjetaR(caso,false)}
          </div>
          <div class="qcard" data-quiz>
            <div class="qmeta">
              <span class="step">${esc(q.etiqueta)} &nbsp;|&nbsp; Pregunta ${qi+1} de 3</span>
              <span class="qdots">${dots}</span>
            </div>
            <h3 class="q">${esc(q.enunciado)}</h3>
            <div class="opts">${opts}</div>
            <div class="fb" data-fb-ok>
              <h4><span class="mk">&#10003;</span>${esc(q.ok.h)}</h4>
              <p>${esc(q.ok.p)}</p>
              <div class="act"><button class="btn" data-go="next">Continuar <span class="ar">&#8594;</span></button></div>
            </div>
            <div class="fb wrong" data-fb-bad>
              <h4><span class="mk">&#10007;</span>${esc(q.mal.h)}</h4>
              <p>${esc(q.mal.p)}</p>
              <div class="act"><button class="btn btn--ghost" data-retry>Intentar nuevamente</button></div>
            </div>
          </div>
        </div>
      </section>`});
  });
});

slides.push({ chapter:4, lock:false, close:true, acc:'var(--green)', accInk:'#fff',
  html:`<section class="slide">
    <div class="close-wrap">
      <p class="eyebrow">Para llevarte</p>
      <h2 class="close-title">El coeficiente y el diagrama se leen juntos</h2>
      <div class="keys">
        <div class="key" style="--kc:var(--blue)">
          <span class="kl">Signo</span>
          <h3>Indica la dirección</h3>
          <p>Positivo cuando las variables cambian en el mismo sentido; negativo cuando cambian en sentidos opuestos.</p>
        </div>
        <div class="key" style="--kc:var(--amber)">
          <span class="kl">Magnitud</span>
          <h3>Indica la fuerza</h3>
          <p>Cerca de +1 o −1 la relación es fuerte y los puntos se apegan al patrón; en valores intermedios la dispersión aumenta.</p>
        </div>
        <div class="key" style="--kc:var(--green)">
          <span class="kl">Contexto</span>
          <h3>Permite concluir</h3>
          <p>Con las dos lecturas anteriores puedes comunicar una conclusión basada en los datos y útil para la decisión.</p>
        </div>
      </div>
    </div>
  </section>`});

/* ============================ MOTOR ============================ */
const box = document.getElementById('slides');
box.innerHTML = slides.map(s=>s.html).join('');
const nodes = Array.from(box.querySelectorAll('.slide'));

const CHAPTERS = ['Inicio','Caso 1','Caso 2','Caso 3','Cierre'];
const chipBox = document.getElementById('chips');
chipBox.innerHTML = CHAPTERS.map((c,i)=>`<button class="chip" data-ch="${i}">${c}</button>`).join('');

const counter = document.getElementById('counter');
const fill = document.getElementById('fill');
const lock = document.getElementById('lock');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const logoSm = document.getElementById('logoSm');

const resuelta = new Set();
let idx = 0, maxAlcanzado = 0;
const abierta = i => !slides[i].lock || resuelta.has(i);

function render(){
  nodes.forEach((n,i)=>n.classList.toggle('is-active', i===idx));
  const s = slides[idx];
  document.documentElement.style.setProperty('--acc', s.acc);
  document.documentElement.style.setProperty('--acc-ink', s.accInk);
  document.body.classList.toggle('is-cover', !!s.cover);
  document.body.classList.toggle('is-close', !!s.close);
  logoSm.style.visibility = s.cover ? 'hidden' : 'visible';
  counter.textContent = (idx+1) + ' / ' + slides.length;
  fill.style.width = ((idx+1)/slides.length*100) + '%';
  prev.disabled = idx === 0;
  next.disabled = idx === slides.length-1 || !abierta(idx);
  lock.classList.toggle('show', !abierta(idx));
  chipBox.querySelectorAll('.chip').forEach(c=>{
    const ch = Number(c.dataset.ch);
    const first = slides.findIndex(x=>x.chapter===ch);
    c.classList.toggle('on', ch === s.chapter);
    c.classList.toggle('blocked', first > maxAlcanzado);
  });
}
function go(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  if(i > idx && !abierta(idx)) return;
  if(i > maxAlcanzado && i > idx + 1) return;
  idx = i;
  maxAlcanzado = Math.max(maxAlcanzado, idx);
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

prev.addEventListener('click', ()=>go(idx-1));
next.addEventListener('click', ()=>go(idx+1));
chipBox.addEventListener('click', e=>{
  const b = e.target.closest('[data-ch]'); if(!b) return;
  const first = slides.findIndex(s=>s.chapter===Number(b.dataset.ch));
  if(first < 0 || first > maxAlcanzado) return;
  if(first > idx && !abierta(idx)) return;
  idx = first; render(); window.scrollTo({top:0,behavior:'instant'});
});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'){ go(idx+1); }
  else if(e.key==='ArrowLeft'){ go(idx-1); }
});

box.addEventListener('click', e=>{
  const goNext = e.target.closest('[data-go="next"]');
  const retry  = e.target.closest('[data-retry]');
  const opt    = e.target.closest('.opt');

  if(goNext){ go(idx+1); return; }
  if(retry){
    const card = retry.closest('[data-quiz]');
    card.querySelectorAll('.opt').forEach(o=>{ o.disabled=false; o.classList.remove('is-right','is-wrong','is-dim'); });
    card.querySelectorAll('.fb').forEach(f=>f.classList.remove('show'));
    card.querySelector('.opt').focus();
    return;
  }
  if(opt && !opt.disabled){
    const card = opt.closest('[data-quiz]');
    const bien = opt.dataset.ok === 'true';
    card.querySelectorAll('.fb').forEach(f=>f.classList.remove('show'));
    card.querySelectorAll('.opt').forEach(o=>o.disabled = true);
    if(bien){
      opt.classList.add('is-right');
      card.querySelectorAll('.opt').forEach(o=>{ if(o!==opt) o.classList.add('is-dim'); });
      card.querySelector('[data-fb-ok]').classList.add('show');
      resuelta.add(idx); render();
    }else{
      opt.classList.add('is-wrong');
      card.querySelector('[data-fb-bad]').classList.add('show');
    }
  }
});

/* deslizar con el dedo */
let x0 = null, y0 = null;
document.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6) go(idx + (dx < 0 ? 1 : -1));
  x0 = y0 = null;
}, {passive:true});

render();
</script>
</body>
</html>
