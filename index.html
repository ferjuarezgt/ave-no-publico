/* =====================================================================
   PALETA AVE · 2756 C #0f1c75 · 2727 C #1c73f5 · 354 C #00ab0d · 7549 C #ffb500
   ===================================================================== */
:root{
  --navy:#0f1c75;
  --blue:#1c73f5;
  --green:#00ab0d;
  --amber:#ffb500;
  --ink-soft:#4a5275;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--navy);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  background:
    radial-gradient(720px 520px at 100% -8%, rgba(28,115,245,.14), transparent 68%),
    radial-gradient(620px 480px at -8% 106%, rgba(0,171,13,.12), transparent 68%),
    #fff;
  display:flex;
  min-height:100%;
}

.wrap{
  width:100%;max-width:980px;margin:auto;
  padding:clamp(28px,6vw,64px);
}

.logo{height:clamp(54px,7.5vw,86px);width:auto;display:block;margin-bottom:clamp(26px,4.4vw,44px)}

.rule{display:flex;gap:6px;margin-bottom:clamp(18px,2.6vw,26px)}
.rule i{height:6px;width:clamp(30px,4.4vw,52px);border-radius:99px;display:block}

.eyebrow{
  font-size:clamp(11.5px,1.25vw,13.5px);font-weight:700;letter-spacing:.17em;
  color:var(--green);margin:0 0 clamp(10px,1.6vw,14px);
}
h1{
  font-size:clamp(36px,7vw,78px);line-height:.98;letter-spacing:-.04em;
  font-weight:800;margin:0 0 clamp(16px,2.4vw,24px);max-width:14ch;
}
h1 em{font-style:normal;font-weight:300;color:var(--blue);display:block;letter-spacing:-.035em}

p.lead{
  font-size:clamp(15px,1.7vw,20px);line-height:1.6;font-weight:400;
  color:var(--ink-soft);margin:0;max-width:52ch;
}
p.sub{
  font-size:clamp(13px,1.4vw,16px);line-height:1.6;font-weight:500;
  color:#7a84a8;margin:clamp(14px,2vw,18px) 0 0;max-width:52ch;
}

.foot{
  margin-top:clamp(34px,6vw,60px);padding-top:clamp(14px,2vw,18px);
  border-top:1px solid #e3e8f6;
  font-size:clamp(11.5px,1.2vw,13px);font-weight:600;letter-spacing:.04em;color:#8e97b6;
}

@media (max-width:520px){
  h1{max-width:100%}
}
</style>
