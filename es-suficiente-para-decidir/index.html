<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Es suficiente para decidir? · AVE UVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PALETA AVE · 2756 C #0f1c75 · 2727 C #1c73f5 · 354 C #00ab0d · 7549 C #ffb500
   Maquetación fluida: se adapta al ancho y no depende del alto.
   ===================================================================== */
:root{
  --navy:#0f1c75; --navy-25:#c3c7de;
  --blue:#1c73f5; --blue-50:#8db9fa; --blue-10:#e8f1fe;
  --green:#00ab0d; --green-10:#e5f7e7;
  --amber:#ffb500; --amber-15:#fff4da;
  --paper:#f4f7fd; --ink:#101534; --ink-soft:#4a5275;
  --acc:var(--blue); --acc-ink:#fff;
  --shadow:0 16px 44px -28px rgba(15,28,117,.55);
  --pad:clamp(15px,2.2vw,26px);
}
*{box-sizing:border-box}
html{margin:0}
body{
  margin:0;background:var(--paper);min-height:100%;
  font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
#app{max-width:1200px;margin:0 auto;padding:var(--pad) var(--pad) calc(var(--pad) + 8px)}
body.is-cover{background:#fff}
body.is-close{background:#0d1667}

/* barra superior */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo-sm{height:clamp(26px,2.6vw,34px);width:auto;display:block;flex:0 0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:clamp(12px,1.25vw,14px);font-weight:700;border:0;cursor:pointer;border-radius:99px;padding:9px 15px;background:transparent;color:#7c87ae;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}
.chip.blocked{opacity:.36;cursor:not-allowed}
.counter{font-size:clamp(12px,1.2vw,13.5px);font-weight:700;color:#7c87ae;font-variant-numeric:tabular-nums;flex:0 0 auto}
body.is-close .chip{color:#9aa8dd}
body.is-close .chip.on{background:#fff;color:var(--navy)}
body.is-close .counter{color:#9aa8dd}
body.is-close .logo-sm{background:#fff;border-radius:9px;padding:5px 9px;box-sizing:content-box}
.track{height:6px;border-radius:99px;background:#e2e8f7;overflow:hidden;margin-bottom:clamp(14px,2.2vw,24px)}
body.is-close .track{background:rgba(255,255,255,.18)}
.track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s ease}

/* diapositivas */
.slide{display:none}
.slide.is-active{display:block}

/* portada */
.cover-logo{height:clamp(52px,7vw,84px);width:auto;display:block;margin-bottom:clamp(18px,2.8vw,30px)}
.eyebrow{font-size:clamp(11.5px,1.2vw,13px);font-weight:700;letter-spacing:.15em;color:var(--green);margin:0 0 10px}
h1.cover-title{font-size:clamp(32px,5.6vw,64px);line-height:1;letter-spacing:-.035em;font-weight:800;color:var(--navy);margin:0 0 clamp(14px,2vw,20px)}
h1.cover-title em{font-style:normal;font-weight:300;display:block;color:var(--blue);letter-spacing:-.03em}
.lead{font-size:clamp(14.5px,1.5vw,17.5px);line-height:1.62;color:var(--ink-soft);margin:0;max-width:62ch}

/* escala */
.scale{position:relative;margin:clamp(40px,4.6vw,54px) 0 8px}
.scale-track{height:13px;border-radius:99px;position:relative;background:linear-gradient(90deg,var(--navy) 0%,#9aa2ce 28%,#e7ebf6 50%,var(--blue-50) 72%,var(--blue) 100%);box-shadow:inset 0 0 0 1px rgba(15,28,117,.1)}
.scale-zero{position:absolute;left:50%;top:-7px;bottom:-7px;width:2px;background:rgba(15,28,117,.3);transform:translateX(-50%)}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:12px}
.scale-ends span:nth-child(2){opacity:.5}
.scale-zones{display:grid;grid-template-columns:repeat(6,1fr);margin-top:7px;font-size:clamp(9px,.95vw,11px);font-weight:500;color:#8a92b4;text-align:center}
.scale-zones span{padding-top:5px;border-top:1px solid rgba(15,28,117,.12)}
.pin{position:absolute;top:6px;transform:translateY(-50%);margin-left:-12px}
.pin-dot{width:24px;height:24px;border-radius:50%;background:#fff;border:6px solid var(--pc,var(--blue));box-shadow:0 4px 12px rgba(15,28,117,.28)}
.pin-label{position:absolute;left:12px;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:11px;font-weight:700;color:var(--pc,var(--blue))}
.pin-label b{display:block;font-size:clamp(16px,1.9vw,22px);font-weight:800;letter-spacing:-.02em}
.pin--up .pin-label{bottom:28px}
.scale--dark .scale-track{box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.scale--dark .scale-ends{color:#aab8ea}
.scale--dark .scale-zones{color:#8e9bd4}
.scale--dark .scale-zones span{border-top-color:rgba(255,255,255,.16)}
.scale--dark .scale-zero{background:rgba(255,255,255,.4)}

/* encabezados de sección */
.kicker{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:clamp(11.5px,1.25vw,13px);font-weight:700;letter-spacing:.09em;color:var(--acc)}
.kicker .bar{height:3px;width:38px;background:var(--acc);border-radius:9px;flex:0 0 auto}
h2.title{font-size:clamp(23px,3.2vw,36px);line-height:1.08;letter-spacing:-.032em;font-weight:800;color:var(--navy);margin:0}
.intro{font-size:clamp(14.5px,1.45vw,16.5px);line-height:1.58;color:var(--ink-soft);margin:10px 0 clamp(14px,1.9vw,20px);max-width:82ch}
.split{display:grid;gap:clamp(14px,1.9vw,24px);grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);align-items:center}

.figure{background:#fff;border-radius:18px;padding:clamp(10px,1.1vw,16px);box-shadow:var(--shadow);margin:0}
.figure img{display:block;width:100%;height:auto;border-radius:10px}

.rcard{margin-top:clamp(12px,1.4vw,16px);background:var(--navy);color:#fff;border-radius:18px;padding:clamp(16px,1.8vw,22px) clamp(18px,2vw,26px)}
.rcard-top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.rval{font-size:clamp(34px,4.4vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.rval .rsym{font-style:italic;font-weight:600;opacity:.62;font-size:.42em;margin-right:.18em}
.rmeta{font-size:clamp(12px,1.25vw,13.5px);font-weight:500;color:#aab8ea;line-height:1.5;max-width:28ch}
.aside{margin:14px 2px 0;font-size:clamp(13px,1.32vw,15px);line-height:1.56;color:var(--ink-soft)}

/* tarjetas */
.cards3{display:grid;gap:clamp(12px,1.6vw,20px);grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border-radius:18px;padding:clamp(18px,2.2vw,28px);border-top:5px solid var(--acc);box-shadow:var(--shadow)}
.card .num{display:block;font-size:clamp(24px,2.8vw,34px);font-weight:800;color:var(--acc);line-height:1;margin-bottom:10px;letter-spacing:-.04em}
.card h3{margin:0 0 8px;font-size:clamp(15.5px,1.6vw,18px);font-weight:700;color:var(--navy);letter-spacing:-.015em}
.card p{margin:0;font-size:clamp(13.5px,1.35vw,15.5px);line-height:1.58;color:var(--ink-soft)}

/* preguntas */
.qcard{background:#fff;border-radius:22px;padding:clamp(20px,2.4vw,32px);box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.step{font-size:clamp(11.5px,1.2vw,13px);font-weight:700;letter-spacing:.07em;color:var(--acc)}
.qdots{display:flex;gap:5px;flex:0 0 auto}
.qdots i{width:22px;height:4px;border-radius:9px;background:var(--navy-25)}
.qdots i.on{background:var(--acc)}
.quote{
  background:var(--blue-10);border-left:5px solid var(--blue);border-radius:0 14px 14px 0;
  padding:16px 18px;margin:0 0 16px;
}
.quote .who{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;color:#0f4eb8;margin-bottom:7px}
.quote p{margin:0;font-size:clamp(14.5px,1.55vw,17px);line-height:1.5;font-weight:700;color:var(--navy);font-style:italic}
h3.q{margin:0 0 clamp(14px,1.8vw,20px);font-size:clamp(18px,2.1vw,25px);line-height:1.28;letter-spacing:-.024em;font-weight:700;color:var(--navy)}
.note{margin:-6px 0 14px;font-size:clamp(12px,1.25vw,13.5px);font-weight:700;letter-spacing:.03em;color:var(--acc)}
.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  font:inherit;font-size:clamp(14.5px,1.45vw,16.5px);font-weight:600;color:var(--ink);line-height:1.4;
  background:var(--paper);border:2px solid transparent;border-radius:14px;
  padding:15px 18px;min-height:58px;transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.opt .bullet{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--navy-25);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--navy)}
.opt--multi .bullet{border-radius:8px;font-size:15px;color:transparent}
.opt--multi.picked .bullet{background:var(--blue);box-shadow:inset 0 0 0 2px var(--blue);color:#fff}
.opt--multi.picked{border-color:var(--blue);background:var(--blue-10)}
.opt:disabled{cursor:default}
.opt.is-right{background:var(--green-10);border-color:var(--green);color:#07600f}
.opt.is-right .bullet{box-shadow:inset 0 0 0 2px var(--green);color:var(--green);background:#fff}
.opt--multi.is-right .bullet{background:var(--green);color:#fff}
.opt.is-wrong{background:var(--amber-15);border-color:var(--amber);color:#7a5600}
.opt.is-wrong .bullet{box-shadow:inset 0 0 0 2px var(--amber);color:#9a6c00;background:#fff}
.opt--multi.is-wrong .bullet{background:var(--amber);color:#fff}
.opt.is-dim{opacity:.4}
.checkrow{margin-top:14px}

.fb{margin-top:16px;border-radius:16px;padding:clamp(16px,1.8vw,20px);display:none;border-left:6px solid var(--green);background:var(--green-10)}
.fb.show{display:block}
.fb.wrong{background:var(--amber-15);border-left-color:var(--amber)}
.fb h4{margin:0 0 8px;font-size:clamp(14.5px,1.5vw,16.5px);font-weight:800;color:#07600f;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.fb.wrong h4{color:#7a5600}
.fb h4 .mk{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.fb.wrong h4 .mk{background:var(--amber)}
.fb p{margin:0;font-size:clamp(13.5px,1.4vw,15.5px);line-height:1.62;color:var(--ink-soft)}
.fb .act{margin-top:16px}

/* cierre */
.close-wrap{background:linear-gradient(150deg,#0b1559,#0f1c75 58%,#16238c);border-radius:22px;padding:clamp(22px,3vw,44px);color:#fff}
.close-wrap .eyebrow{color:var(--amber)}
h2.close-title{font-size:clamp(25px,3.7vw,44px);line-height:1.05;letter-spacing:-.035em;font-weight:800;margin:0 0 clamp(14px,2vw,20px);max-width:26ch}
.close-lead{font-size:clamp(14px,1.45vw,16.5px);line-height:1.62;color:#cfdaff;margin:0 0 clamp(20px,2.6vw,30px);max-width:78ch}
.keys{display:grid;gap:clamp(12px,1.6vw,20px);grid-template-columns:repeat(3,1fr)}
.key{background:rgba(255,255,255,.1);border-radius:18px;padding:clamp(18px,2.2vw,26px);border-top:4px solid var(--kc,var(--blue))}
.key .kl{font-size:11.5px;font-weight:700;letter-spacing:.11em;color:var(--kc,var(--blue));display:block;margin-bottom:10px}
.key h3{margin:0 0 9px;font-size:clamp(15.5px,1.6vw,18px);font-weight:700;color:#fff;letter-spacing:-.015em}
.key p{margin:0;font-size:clamp(13.5px,1.35vw,15px);line-height:1.58;color:#cfdaff}

/* controles */
.navrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:clamp(14px,1.8vw,20px);padding-top:clamp(12px,1.5vw,16px);border-top:1px solid #dde4f5}
body.is-close .navrow{border-top-color:rgba(255,255,255,.18)}
.lock{display:none;align-items:center;gap:9px;flex:1;min-width:200px;font-size:clamp(13px,1.35vw,15px);font-weight:700;color:#8a6200;background:var(--amber-15);border-radius:99px;padding:12px 18px}
.lock.show{display:inline-flex}
.navbtns{display:flex;gap:10px;margin-left:auto}
.btn{font:inherit;font-size:clamp(15px,1.5vw,17px);font-weight:700;border:0;border-radius:99px;padding:16px 26px;min-height:56px;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:10px;line-height:1}
.btn .ar{font-size:1.15em;line-height:1}
.btn--ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.btn:disabled{opacity:.34;cursor:not-allowed}
body.is-close .btn{background:#fff;color:var(--navy)}
body.is-close .btn--ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}

@media (max-width:860px){
  .split{grid-template-columns:1fr}
  .cards3,.keys{grid-template-columns:1fr}
  .navbtns{width:100%;margin-left:0}
  .navbtns .btn{flex:1;justify-content:center;padding:18px;min-height:60px}
  .lock{width:100%;justify-content:center;text-align:center}
  .counter{order:3}
}
@media (min-width:861px){
  .figure img{max-height:min(272px,27vw);object-fit:contain}
}
@media (max-width:520px){
  .qmeta{flex-direction:column;align-items:flex-start;gap:8px}
  .scale-zones{font-size:8.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="scale">

      <div class="pin pin--up" style="left:${pos(CASO.r)};--pc:var(--blue)"><div class="pin-dot"></div><div class="pin-label">Correlación observada<b>+0.91</b></div></div>
      <div class="scale-ends"><span>−1</span><span>0</span><span>+1</span></div>
      <div class="scale-zones"><span>fuerte</span><span>moderada</span><span>débil</span><span>débil</span><span>moderada</span><span>fuerte</span></div>
    </div>
  </section>`});

/* contexto */
slides.push({ chapter:1, lock:false,
  html:`<section class="slide">
    <div class="kicker"><span class="bar"></span> El caso</div>
    <h2 class="title">Satisfacción del cliente y recompra</h2>
    <p class="intro">NovaMarket desea comprender si existe una relación entre el nivel de satisfacción de sus clientes y el porcentaje de clientes que realizan una recompra. Ese porcentaje representa la proporción de clientes que, después de una primera compra, vuelven a comprar en la empresa durante un periodo determinado. Al analizar los datos, el equipo obtuvo una correlación positiva fuerte y el siguiente diagrama de dispersión.</p>
    <div class="split">
      ${figura()}
      <div>
        ${tarjetaR(true)}
        <p class="aside">El dato es claro: cuando la satisfacción sube, la recompra tiende a subir. Lo que sigue es decidir qué se puede concluir de eso y qué no.</p>
      </div>
    </div>
  </section>`});

/* preguntas */
PREGUNTAS.forEach((q, qi) => {
  const dots = PREGUNTAS.map((_,k)=>`<i class="${k<=qi?'on':''}"></i>`).join('');
  const multi = q.tipo === 'multi';
  const opts = q.opciones.map((o,k)=>`
    <button class="opt ${multi?'opt--multi':''}" data-ok="${o.ok}" data-k="${k}" ${o.todas?'data-todas="1"':''}>
      <span class="bullet">${multi ? '&#10003;' : String.fromCharCode(65+k)}</span>
      <span>${esc(o.t)}</span>
    </button>`).join('');

  slides.push({ chapter:qi+2, lock:true,
    html:`<section class="slide">
      <div class="kicker"><span class="bar"></span> NovaMarket &nbsp;|&nbsp; Satisfacción y recompra</div>
      <div class="split" style="margin-top:12px">
        <div>
          ${figura()}
          ${tarjetaR(false)}
        </div>
        <div class="qcard" data-quiz data-tipo="${q.tipo}">
          <div class="qmeta">
            <span class="step">${esc(q.etiqueta)} &nbsp;|&nbsp; Pregunta ${qi+1} de 3</span>
            <span class="qdots">${dots}</span>
          </div>
          ${q.cita ? `<blockquote class="quote"><span class="who">${esc(q.cita.who)}</span><p>“${esc(q.cita.txt)}”</p></blockquote>` : ''}
          <h3 class="q">${esc(q.enunciado)}</h3>
          ${q.nota ? `<p class="note">${esc(q.nota)}</p>` : ''}
          <div class="opts">${opts}</div>
          ${multi ? `<div class="checkrow"><button class="btn" data-check disabled>Comprobar respuesta</button></div>` : ''}
          <div class="fb" data-fb-ok>
            <h4><span class="mk">&#10003;</span>${esc(q.ok.h)}</h4>
            <p>${esc(q.ok.p)}</p>
            <div class="act"><button class="btn" data-go="next">Continuar <span class="ar">&#8594;</span></button></div>
          </div>
          <div class="fb wrong" data-fb-bad>
            <h4><span class="mk">&#10007;</span>${esc(q.mal.h)}</h4>
            <p>${esc(q.mal.p)}</p>
            <div class="act"><button class="btn btn--ghost" data-retry>Intentar nuevamente</button></div>
          </div>
        </div>
      </div>
    </section>`});
});

/* cierre */
slides.push({ chapter:5, lock:false, close:true,
  html:`<section class="slide">
    <div class="close-wrap">
      <p class="eyebrow">Retroalimentación final</p>
      <h2 class="close-title">Una correlación fuerte apoya la decisión, no la toma por ti</h2>
      <p class="close-lead">Una correlación fuerte puede aportar información valiosa para apoyar una decisión, pero no demuestra por sí sola que una variable sea la causa de la otra. Antes de tomar decisiones empresariales es importante analizar otros factores que también pueden influir en los resultados.</p>
      <div class="keys">
        <div class="key" style="--kc:var(--blue)">
          <span class="kl">Relación</span>
          <h3>Sí hay evidencia</h3>
          <p>El valor de r y el diagrama muestran que satisfacción y recompra se mueven juntas en este conjunto de datos.</p>
        </div>
        <div class="key" style="--kc:var(--amber)">
          <span class="kl">Causalidad</span>
          <h3>No está demostrada</h3>
          <p>Que dos variables se relacionen no prueba que una produzca a la otra; puede haber factores detrás que expliquen ambas.</p>
        </div>
        <div class="key" style="--kc:var(--green)">
          <span class="kl">Decisión</span>
          <h3>Evidencia más contexto</h3>
          <p>Promociones, precios de la competencia, disponibilidad de productos y calidad del servicio completan el panorama antes de invertir.</p>
        </div>
      </div>
    </div>
  </section>`});

/* ============================== MOTOR ============================== */
const box = document.getElementById('slides');
box.innerHTML = slides.map(s=>s.html).join('');
const nodes = Array.from(box.querySelectorAll('.slide'));

const CHAPTERS = ['Inicio','El caso','Pregunta 1','Pregunta 2','Pregunta 3','Cierre'];
const chipBox = document.getElementById('chips');
chipBox.innerHTML = CHAPTERS.map((c,i)=>`<button class="chip" data-ch="${i}">${c}</button>`).join('');

const counter = document.getElementById('counter');
const fill = document.getElementById('fill');
const lock = document.getElementById('lock');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const logoSm = document.getElementById('logoSm');

const resuelta = new Set();
let idx = 0, maxAlcanzado = 0;
const abierta = i => !slides[i].lock || resuelta.has(i);

function render(){
  nodes.forEach((n,i)=>n.classList.toggle('is-active', i===idx));
  const s = slides[idx];
  document.body.classList.toggle('is-cover', !!s.cover);
  document.body.classList.toggle('is-close', !!s.close);
  logoSm.style.visibility = s.cover ? 'hidden' : 'visible';
  counter.textContent = (idx+1) + ' / ' + slides.length;
  fill.style.width = ((idx+1)/slides.length*100) + '%';
  prev.disabled = idx === 0;
  next.disabled = idx === slides.length-1 || !abierta(idx);
  lock.classList.toggle('show', !abierta(idx));
  chipBox.querySelectorAll('.chip').forEach(c=>{
    const ch = Number(c.dataset.ch);
    const first = slides.findIndex(x=>x.chapter===ch);
    c.classList.toggle('on', ch === s.chapter);
    c.classList.toggle('blocked', first > maxAlcanzado);
  });
}
function go(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  if(i > idx && !abierta(idx)) return;
  if(i > maxAlcanzado && i > idx + 1) return;
  idx = i; maxAlcanzado = Math.max(maxAlcanzado, idx);
  render(); window.scrollTo({top:0,behavior:'instant'});
}
prev.addEventListener('click', ()=>go(idx-1));
next.addEventListener('click', ()=>go(idx+1));
chipBox.addEventListener('click', e=>{
  const b = e.target.closest('[data-ch]'); if(!b) return;
  const first = slides.findIndex(s=>s.chapter===Number(b.dataset.ch));
  if(first < 0 || first > maxAlcanzado) return;
  if(first > idx && !abierta(idx)) return;
  idx = first; render(); window.scrollTo({top:0,behavior:'instant'});
});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') go(idx+1);
  else if(e.key==='ArrowLeft') go(idx-1);
});

function resolverBien(card){
  card.querySelectorAll('.opt').forEach(o=>o.disabled = true);
  const chk = card.querySelector('[data-check]'); if(chk){ chk.disabled = true; chk.style.display='none'; }
  card.querySelector('[data-fb-ok]').classList.add('show');
  resuelta.add(idx); render();
}
function limpiar(card){
  card.querySelectorAll('.opt').forEach(o=>{
    o.disabled = false;
    o.classList.remove('is-right','is-wrong','is-dim','picked');
  });
  card.querySelectorAll('.fb').forEach(f=>f.classList.remove('show'));
  const chk = card.querySelector('[data-check]'); if(chk){ chk.disabled = true; chk.style.display=''; }
}

box.addEventListener('click', e => {
  const goNext = e.target.closest('[data-go="next"]');
  const retry  = e.target.closest('[data-retry]');
  const check  = e.target.closest('[data-check]');
  const opt    = e.target.closest('.opt');
  const card   = e.target.closest('[data-quiz]');

  if(goNext){ go(idx+1); return; }
  if(retry){ limpiar(retry.closest('[data-quiz]')); return; }

  /* ---- selección múltiple ---- */
  if(check && card){
    const marcadas = Array.from(card.querySelectorAll('.opt.picked'));
    const factores = Array.from(card.querySelectorAll('.opt:not([data-todas])'));
    const completo = factores.every(o=>o.classList.contains('picked'));
    card.querySelectorAll('.fb').forEach(f=>f.classList.remove('show'));
    if(completo){
      card.querySelectorAll('.opt').forEach(o=>{ o.classList.remove('picked'); o.classList.add('is-right'); });
      resolverBien(card);
    }else{
      marcadas.forEach(o=>{ o.classList.remove('picked'); o.classList.add('is-wrong'); });
      card.querySelectorAll('.opt').forEach(o=>o.disabled = true);
      card.querySelector('[data-fb-bad]').classList.add('show');
    }
    return;
  }

  if(opt && !opt.disabled && card){
    if(card.dataset.tipo === 'multi'){
      if(opt.dataset.todas){
        const activar = !opt.classList.contains('picked');
        card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('picked', activar));
      }else{
        opt.classList.toggle('picked');
        const todas = card.querySelector('[data-todas]');
        const factores = Array.from(card.querySelectorAll('.opt:not([data-todas])'));
        if(todas) todas.classList.toggle('picked', factores.every(o=>o.classList.contains('picked')));
      }
      card.querySelector('[data-check]').disabled = !card.querySelector('.opt.picked');
      return;
    }
    /* ---- opción única ---- */
    const bien = opt.dataset.ok === 'true';
    card.querySelectorAll('.fb').forEach(f=>f.classList.remove('show'));
    card.querySelectorAll('.opt').forEach(o=>o.disabled = true);
    if(bien){
      opt.classList.add('is-right');
      card.querySelectorAll('.opt').forEach(o=>{ if(o!==opt) o.classList.add('is-dim'); });
      resolverBien(card);
    }else{
      opt.classList.add('is-wrong');
      card.querySelector('[data-fb-bad]').classList.add('show');
    }
  }
});

/* deslizar con el dedo */
let x0=null,y0=null;
document.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) go(idx + (dx<0?1:-1));
  x0=y0=null;
}, {passive:true});

render();
</script>
</body>
</html>
